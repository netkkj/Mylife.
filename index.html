<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft - The End Poem</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #030303;
            color: #e0e0e0;
        }

        /* Container do GIF de Fundo (1.gif) */
        .gif-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            transition: opacity 3s ease-in-out;
            background: #030303;
        }

        .gif-background img {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%) scale(1.15);
            filter: brightness(0.55) contrast(1.15) blur(2px);
            object-fit: cover;
        }

        /* Canvas de Partículas Minimalistas (Garantido em camada superior ao fundo) */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            transition: opacity 3s ease-in-out;
        }

        /* Vinheta */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.8) 90%);
            z-index: -1;
            pointer-events: none;
        }

        /* Conteúdo Principal */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            z-index: 1;
            transition: opacity 3s ease-in-out;
        }

        .pixel-title {
            font-family: 'VT323', monospace;
            font-size: 4rem;
            color: #e5e5e5;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
            animation: fadeIn 2s ease-in-out;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 300;
            color: #aaa;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
            animation: fadeIn 2.5s ease-in-out;
        }

        /* Botão Interativo Estilizado */
        .play-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 14px 35px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            animation: pulse 3s infinite;
        }

        .play-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        .footer-credit {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
            transition: opacity 3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.15); }
            70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
    </style>
</head>
<body>

    <div class="gif-background" id="bg-container">
        <img src="1.gif" alt="Minecraft Background" onerror="this.style.display='none'; console.log('Erro ao carregar 1.gif');">
    </div>

    <canvas id="particles-canvas"></canvas>

    <div id="audio-container" style="display:none;"></div>

    <div class="overlay"></div>

    <div class="container" id="main-content">
        <h1 class="pixel-title">O FIM DO JOGO</h1>
        <p class="subtitle">"E o universo disse: Eu te amo, porque você é o amor..." <br> Uma jornada inesquecível construída bloco por bloco.</p>
        
        <button class="play-btn" onclick="startExperience()">Iniciar Experiência</button>
    </div>

    <div class="footer-credit" id="footer-credit">Poema Narrado: [http://www.youtube.com/watch?v=VqZZLTJkl5Q]</div>

    <script>
        // Inicialização do sistema de partículas minimalistas isolado e garantido
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.5;
                this.speedY = (Math.random() * 0.3 - 0.15);
                this.speedX = (Math.random() * 0.2 - 0.1);
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.alpha += (Math.random() > 0.5 ? 1 : -1) * 0.01;
                if (this.alpha < 0.1) this.alpha = 0.1;
                if (this.alpha > 0.8) this.alpha = 0.8;

                if (this.y < 0 || this.y > canvas.height || this.x < 0 || this.x > canvas.width) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Carrega a API do YouTube dinamicamente para o áudio do poema
        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        let firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let audioPlayer;

        window.onYouTubeIframeAPIReady = function() {
            audioPlayer = new YT.Player('audio-container', {
                height: '1',
                width: '1',
                videoId: 'VqZZLTJkl5Q',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0
                },
                events: {
                    'onStateChange': (event) => {
                        // YT.PlayerState.ENDED = 0 (Terminou o poema)
                        if (event.data === 0) {
                            triggerFadeOut();
                        }
                    }
                }
            });
        };

        // Inicia a experiência e ativa o áudio ao clicar no botão
        function startExperience() {
            if (audioPlayer && typeof audioPlayer.playVideo === 'function') {
                audioPlayer.playVideo();
            }

            // Esconde o botão interativo
            document.querySelector('.play-btn').style.display = 'none';

            // Segurança: Duração aproximada do poema narrado (~11 minutos e 4 segundos = 664000ms)
            setTimeout(() => {
                triggerFadeOut();
            }, 664000);
        }

        // Função de Fade Out suave que apaga tudo ao final do poema
        function triggerFadeOut() {
            document.getElementById('bg-container').style.opacity = '0';
            document.getElementById('particles-canvas').style.opacity = '0';
            document.getElementById('main-content').style.opacity = '0';
            document.getElementById('footer-credit').style.opacity = '0';
        }
    </script>
</body>
</html>
